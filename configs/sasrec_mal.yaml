protocol: "corrected_v3"
dataset: "mal"
anime_path:   "data/mal/anime.csv"
ratings_path: "data/mal/animelist.csv"
min_interactions: 15
rtg_window: 20
rtg_scale:  20.0
drop_incomplete_rtg: true
user_split: "random"
split_seed: 42
val_fraction: 0.1
test_fraction: 0.1
rating_scale: 10.0

model: "sasrec"
use_pad_token: true
hidden_size: 128
n_layer: 2
n_head: 4
dropout: 0.2
context_len: 20

batch_size: 512
max_steps: 20000
lr: 1.0e-4
weight_decay: 1.0e-4
warmup_steps: 500
num_workers: 4
